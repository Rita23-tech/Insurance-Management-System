{% extends 'insurance/adminbase.html' %}
{% block content %}
{%load static%}

<head>
  <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
  <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>
  <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>

  <style media="screen">
    a:link {
      text-decoration: none;
    }

    h6 {
      text-align: center;
    }

    /* ---------- Colours only: midnight navy, deep blue, black, white ---------- */

    /* Panel: navy heading, navy outline */
    .panel-primary {
      border-color: #0a1230;
    }

    .panel-primary > .panel-heading {
      background: #0a1230;
      border-color: #0a1230;
      color: #ffffff;
    }

    /* Table header: soft blue-grey with a deep blue underline */
    #dev-table > thead > tr > th {
      background: #eef2fb;
      color: #0a1230;
      border-bottom: 2px solid #1d4ed8;
    }

    #dev-table > tbody > tr > td {
      color: #04060f;
      border-top-color: #e1e7f0;
    }

    /* Row hover */
    .table-hover > tbody > tr:hover > td {
      background: #e8efff;
    }

    /* Update button: deep blue */
    .panel .btn-primary {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .panel .btn-primary:hover,
    .panel .btn-primary:focus {
      background: #2f6bff;
      border-color: #2f6bff;
    }

    /* Delete button: red kept so it still reads as the risky one, just a deeper shade */
    .panel .btn-danger {
      background: #dc2626;
      border-color: #dc2626;
      color: #ffffff;
    }

    .panel .btn-danger:hover,
    .panel .btn-danger:focus {
      background: #b91c1c;
      border-color: #b91c1c;
    }
  </style>
</head>
<br><br>
<div class="container">
  <div class="panel panel-primary">
    <div class="panel-heading">
      <h6 class="panel-title">Customers</h6>
    </div>
    <table class="table table-hover" id="dev-table">
      <thead>
        <tr>

          <th>Name</th>
          <th>Profile Picture</th>
          <th>Mobile</th>
          <th>Address</th>
         
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      {% for t in customers %}
      <tr>

        <td> {{t.get_name}}</td>
        <td> <img src="{% static t.profile_pic.url %}" alt="Profile Pic" height="40px" width="40px" /></td>
        <td>{{t.mobile}}</td>
        <td>{{t.address}}</td>
        
        <td><a class="btn btn-primary btn-xs" href="{% url 'update-customer' t.id  %}"><span class="glyphicon glyphicon-edit"></span></a></td>
        <td><a class="btn btn-danger btn-xs" href="{% url 'delete-customer' t.id  %}"><span class="glyphicon glyphicon-trash"></span></a></td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>

<br><br><br><br><br><br>
{% endblock content %}
