<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Insurance Management System</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #EAF0F8;
            color: #172B4D;
            overflow-x: hidden;
        }

        a {
            text-decoration: none !important;
        }

        /* HEADER */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: #102D50;
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 3px 15px rgba(10, 35, 65, 0.2);
            border-bottom: 1px solid #24466B;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        #sidebar_btn {
            color: #E5EFFB;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        #sidebar_btn:hover {
            color: #8DB9EA;
        }

        .left_area h3 {
            color: #FFFFFF;
            margin: 0;
            font-size: 20px;
            font-weight: 750;
            letter-spacing: 0.5px;
        }

        .left_area span {
            color: #82B3E8;
        }

        .right_area {
            margin-left: auto;
        }

        .logout_btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 19px;
            background: #315F91;
            color: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            /* logout is a <button> now, so reset the browser's default button look */
            border: 0;
            cursor: pointer;
            font-family: inherit;
        }

        .logout_btn:hover {
            background: #477BAC;
            color: white;
            transform: translateY(-2px);
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 72px;
            left: 0;
            width: 250px;
            height: calc(100vh - 72px);
            background: #173B63;
            padding: 28px 15px;
            border-right: 1px solid #294E75;
            transition: all 0.3s ease;
            z-index: 900;
            overflow-y: auto;
        }

        .profile-area {
            text-align: center;
            padding: 10px 10px 30px;
            border-bottom: 1px solid #34577B;
            margin-bottom: 20px;
        }

        .sidebar .profile_image {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #547DA5;
            margin-bottom: 12px;
        }

        .sidebar h4 {
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .sidebar h6 {
            display: inline-block;
            background: #294F78;
            color: #C4DDF6 !important;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 13px;
            border-radius: 20px;
            margin: 0;
            border: 1px solid #426B95;
        }

        .sidebar-label {
            color: #9BB7D3;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 15px;
            margin-bottom: 12px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 6px;
            border-radius: 9px;
            color: #D0DFEF;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .sidebar a i {
            font-size: 17px;
            width: 23px;
            text-align: center;
            color: #91B4D8;
        }

        .sidebar a:hover {
            background: #2B527D;
            color: #FFFFFF;
            transform: translateX(3px);
        }

        .sidebar a:hover i {
            color: #FFFFFF;
        }

        /* COLLAPSED SIDEBAR */

        #check {
            display: none;
        }

        #check:checked ~ .sidebar {
            width: 82px;
            padding-left: 10px;
            padding-right: 10px;
        }

        #check:checked ~ .sidebar .profile-area {
            padding: 5px 0 20px;
        }

        #check:checked ~ .sidebar .profile_image {
            width: 48px;
            height: 48px;
        }

        #check:checked ~ .sidebar .profile-area h4,
        #check:checked ~ .sidebar .profile-area h6,
        #check:checked ~ .sidebar .sidebar-label,
        #check:checked ~ .sidebar a span {
            display: none;
        }

        #check:checked ~ .sidebar a {
            justify-content: center;
            padding: 15px 5px;
        }

        #check:checked ~ .sidebar a i {
            font-size: 19px;
            width: auto;
        }

        /* MAIN CONTENT */

        .content {
            margin-left: 250px;
            margin-top: 72px;
            min-height: calc(100vh - 72px);
            padding: 30px;
            background: #EAF0F8;
            transition: all 0.3s ease;
        }

        #check:checked ~ .content {
            margin-left: 82px;
        }

        /* RESPONSIVE DESIGN */

        @media (max-width: 768px) {

            header {
                padding: 0 18px;
            }

            .left_area h3 {
                font-size: 16px;
            }

            .header-left {
                gap: 18px;
            }

            .logout_btn {
                padding: 9px 12px;
                font-size: 12px;
            }

            .sidebar {
                width: 250px;
                left: -260px;
            }

            #check:checked ~ .sidebar {
                width: 250px;
                left: 0;
                padding: 28px 15px;
                box-shadow: 5px 0 25px rgba(0,0,0,0.2);
            }

            #check:checked ~ .sidebar .profile_image {
                width: 85px;
                height: 85px;
            }

            #check:checked ~ .sidebar .profile-area h4,
            #check:checked ~ .sidebar .profile-area h6,
            #check:checked ~ .sidebar .sidebar-label,
            #check:checked ~ .sidebar a span {
                display: inline-block;
            }

            #check:checked ~ .sidebar .sidebar-label {
                display: block;
            }

            #check:checked ~ .sidebar a {
                justify-content: flex-start;
                padding: 14px 16px;
            }

            #check:checked ~ .sidebar a i {
                width: 23px;
            }

            .content,
            #check:checked ~ .content {
                margin-left: 0;
                padding: 22px 15px;
            }
        }

        @media (max-width: 400px) {
            .left_area h3 {
                font-size: 14px;
            }

            .logout_btn {
                padding: 8px 10px;
            }
        }

    </style>
</head>

<body>

    <input type="checkbox" id="check">

    <!-- HEADER START -->

    <header>

        <div class="header-left">

            <label for="check">
                <i class="fas fa-bars" id="sidebar_btn"></i>
            </label>

            <div class="left_area">
                <h3>INSURANCE <span>MANAGEMENT</span></h3>
            </div>

        </div>

        <div class="right_area">
            <!-- Django 5+ only accepts POST for logout, so this is a form with a button instead of a link -->
            <form action="/logout" method="post" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="logout_btn">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </form>
        </div>

    </header>

    <!-- HEADER END -->


    <!-- SIDEBAR START -->

    <div class="sidebar">

        <div class="profile-area">

            <img src="{% static customer.profile_pic.url %}"
                 class="profile_image"
                 alt="Customer Profile">

            <h4>{{request.user.first_name}}</h4>

            <h6>Customer</h6>

        </div>

        <div class="sidebar-label">
            Main Menu
        </div>

        <a href="/customer/customer-dashboard">
            <i class="fas fa-tachometer-alt"></i>
            <span>Dashboard</span>
        </a>

        <a href="/customer/apply-policy">
            <i class="fas fa-shield-alt"></i>
            <span>Apply Policy</span>
        </a>

        <a href="/customer/history">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>

        <div class="sidebar-label" style="margin-top: 25px;">
            Support
        </div>

        <a href="/customer/ask-question">
            <i class="fas fa-question-circle"></i>
            <span>Ask Question</span>
        </a>

        <a href="/customer/question-history">
            <i class="fas fa-comments"></i>
            <span>Question History</span>
        </a>

    </div>

    <!-- SIDEBAR END -->


    <!-- CONTENT START -->

    <div class="content">

        {% block content %}

        {% endblock content %}

    </div>

    <!-- CONTENT END -->

</body>

</html>
